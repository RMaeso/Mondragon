# Catálogo de series. Los códigos de filtro son la propuesta inicial y se validan con
# `python src/verificar.py` antes de estimar: el informe compara la etiqueta que devuelve
# la fuente con la descripción de esta ficha. Donde hay `alternativas`, el descargador
# prueba cada juego de filtros en orden hasta que uno devuelve datos.
#
# frecuencia: M o Q en origen. agregacion: media (índices, precios, tipos) o suma (flujos).
# transformacion: dlog (100 x diferencia logarítmica trimestral) o nivel.
# ajuste: SA (desestacionalizada en origen) o NSA (se añaden dummies trimestrales).

pib_ea:
  etiqueta: PIB real zona euro
  unidad: "% var. media anual"
  fuente: eurostat
  dataset: namq_10_gdp
  # EA21: zona euro con Bulgaria (desde 2026). Eurostat ha recalculado la historia con la nueva composición.
  filtros: {geo: EA21, unit: CLV10_MEUR, s_adj: SCA, na_item: B1GQ}
  alternativas: [{geo: EA20, unit: CLV10_MEUR, s_adj: SCA, na_item: B1GQ}]
  frecuencia: Q
  agregacion: media
  transformacion: dlog
  ajuste: SA

pib_es:
  etiqueta: PIB real España
  unidad: "% var. media anual"
  fuente: eurostat
  dataset: namq_10_gdp
  filtros: {geo: ES, unit: CLV10_MEUR, s_adj: SCA, na_item: B1GQ}
  frecuencia: Q
  agregacion: media
  transformacion: dlog
  ajuste: SA

pib_pv:
  etiqueta: PIB real País Vasco
  unidad: "% var. media anual"
  fuente: eustat
  # Tabla PX_170115_ccet_cet04tb (PIB trimestral por territorio): C.A. de Euskadi, nivel, datos
  # corregidos de efectos estacionales y de calendario, índice de volumen encadenado, desde 1995-1.
  # La API PX-Web de Eustat no admite consultas; se usa una consulta guardada (JSON-stat 2) con
  # punto de inicio fijo, que añade los trimestres nuevos al publicarse. Si deja de responder,
  # se vuelve a crear desde la web de la tabla o se usa datos/manuales/pib_pv.csv.
  tabla: PX_170115_ccet_cet04tb
  consulta_guardada: https://www.eustat.eus/bankupx/sq/af85e2f7-0014-4c9c-9dc5-d2f37d04bbaf
  frecuencia: Q
  agregacion: media
  transformacion: dlog
  ajuste: SA

hicp_es:
  etiqueta: Inflación España (IAPC)
  unidad: "% var. media anual"
  fuente: eurostat
  # Desde 2026 el IAPC se publica con ECOICOP ver.2; prc_hicp_midx se congeló en dic-2025.
  dataset: prc_hicp_minr
  filtros: {geo: ES, unit: I25, coicop18: TOTAL}
  alternativas: [{geo: ES, unit: I15, coicop18: TOTAL}]
  frecuencia: M
  agregacion: media
  transformacion: dlog
  ajuste: NSA_DESEST  # se desestacionaliza (descomposición clásica) antes de entrar en el núcleo

euribor3m:
  etiqueta: Euríbor 3 meses
  unidad: "%, media anual"
  fuente: bce
  flujo: FM
  clave: M.U2.EUR.RT.MM.EURIBOR3MD_.HSTA
  frecuencia: M
  agregacion: media
  transformacion: nivel
  ajuste: SA

